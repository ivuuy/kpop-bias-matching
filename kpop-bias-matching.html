<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Kpop女豆本命偶像匹配</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FF6B9D;
            --secondary: #C77DFF;
            --bg: #07071a;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.55);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Stars ── */
        #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .star {
            position: absolute; border-radius: 50%; background: #fff;
            animation: twinkle var(--d, 3s) ease-in-out infinite;
            animation-delay: var(--dl, 0s);
        }
        @keyframes twinkle {
            0%,100% { opacity: .15; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.6); }
        }

        /* ── Orbs ── */
        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px);
            pointer-events: none; z-index: 0; opacity: .25;
        }
        .orb1 { width: 400px; height: 400px; background: #a020f0; top: -100px; left: -100px; }
        .orb2 { width: 350px; height: 350px; background: #FF1493; bottom: -80px; right: -80px; }

        /* ── Layout ── */
        .container {
            position: relative; z-index: 1;
            max-width: 560px; margin: 0 auto; padding: 24px 20px;
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
        }

        /* ── Screens ── */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeUp .45s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Welcome ── */
        .welcome-top { text-align: center; margin-bottom: 28px; }
        .floating { font-size: 3.2rem; display: block; margin-bottom: 14px;
            animation: float 3.5s ease-in-out infinite; }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        .title {
            font-size: 2rem; font-weight: 700; line-height: 1.3;
            background: linear-gradient(135deg, #FF6B9D, #C77DFF);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: var(--muted); font-size: .85rem; margin-top: 6px; }

        /* ── Card ── */
        .card {
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px; padding: 22px;
            backdrop-filter: blur(12px);
            margin-bottom: 16px;
        }

        /* ── Group tags ── */
        .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
        .tag {
            background: rgba(255,107,157,.13);
            border: 1px solid rgba(255,107,157,.3);
            border-radius: 20px; padding: 3px 11px;
            font-size: .72rem; color: #FF6B9D;
        }

        /* ── Buttons ── */
        .btn {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            cursor: pointer; font-size: .95rem;
            font-family: 'Noto Sans SC', sans-serif; font-weight: 500;
            transition: all .3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF6B9D, #C77DFF); color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,107,157,.35); }
        .btn-ghost {
            background: rgba(255,255,255,.08); color: #fff;
            border: 1px solid rgba(255,255,255,.18); margin-top: 10px;
        }
        .btn-ghost:hover { background: rgba(255,255,255,.14); }

        /* ── Progress ── */
        .prog-label { font-size: .75rem; color: var(--muted); margin-bottom: 7px; }
        .prog-track { background: rgba(255,255,255,.1); border-radius: 10px; height: 5px; margin-bottom: 22px; overflow: hidden; }
        .prog-fill { height: 100%; background: linear-gradient(90deg, #FF6B9D, #C77DFF); border-radius: 10px; transition: width .5s ease; }

        /* ── Question ── */
        .q-num { font-size: .75rem; color: #FF6B9D; font-weight: 600; margin-bottom: 6px; letter-spacing: .06em; }
        .q-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 18px; line-height: 1.5; }

        /* ── Options ── */
        .opts { display: grid; gap: 9px; }
        .opts.c2 { grid-template-columns: 1fr 1fr; }
        .opts.c3 { grid-template-columns: 1fr 1fr 1fr; }
        .opts.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

        .opt {
            padding: 11px 13px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,.13);
            background: rgba(255,255,255,.05);
            color: #fff; cursor: pointer; font-size: .82rem;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all .2s ease; text-align: center; line-height: 1.4;
        }
        .opt:hover { background: rgba(255,107,157,.18); border-color: rgba(255,107,157,.45); transform: translateY(-1px); }
        .opt.selected { background: linear-gradient(135deg, rgba(255,107,157,.3), rgba(199,125,255,.3)); border-color: #FF6B9D; }

        /* ── Loading ── */
        .load-wrap { text-align: center; padding: 50px 0; }
        .spinner {
            width: 72px; height: 72px; border-radius: 50%;
            border: 4px solid rgba(255,255,255,.1);
            border-top-color: #FF6B9D; border-right-color: #C77DFF;
            animation: spin 1s linear infinite; margin: 0 auto 22px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .load-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .load-sub { color: var(--muted); font-size: .85rem; }

        /* ── Result hero ── */
        .result-hero {
            border-radius: 20px; padding: 36px 22px;
            text-align: center; margin-bottom: 16px;
            position: relative; overflow: hidden;
        }
        .hero-emoji { font-size: 3rem; margin-bottom: 12px; display: block; }
        .hero-name { font-size: 2.2rem; font-weight: 700; margin-bottom: 6px; }
        .hero-traits { font-size: .8rem; opacity: .8; letter-spacing: .04em; }

        /* ── Members grid ── */
        .members-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center; }
        .member-card {
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px; padding: 8px 12px;
            text-align: center; min-width: 72px; flex: 1 1 72px; max-width: 100px;
        }
        .member-name { font-size: .85rem; font-weight: 600; margin-bottom: 2px; }
        .member-pos { font-size: .68rem; opacity: .7; }

        /* ── Match bars ── */
        .match-item { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
        .match-name { width: 110px; font-size: .78rem; flex-shrink: 0; }
        .bar-track { flex: 1; background: rgba(255,255,255,.1); border-radius: 8px; height: 7px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #FF6B9D, #C77DFF); border-radius: 8px; width: 0%; transition: width 1s ease; }
        .bar-pct { width: 36px; font-size: .75rem; color: var(--muted); text-align: right; }

        /* ── Confetti ── */
        .cf {
            position: fixed; top: -12px; border-radius: 2px;
            animation: fall linear forwards; z-index: 999;
        }
        @keyframes fall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>

/* ───── State ───── */
let cur = 0;
let scores = {};

function initScores() {
    scores = {};
    Object.keys(GROUPS).forEach(g => scores[g] = 0);
}

function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startQuiz() {
    initScores();
    cur = 0;
    show('s-question');
    renderQ();
}

function renderQ() {
    const q = QUESTIONS[cur];
    document.getElementById('prog-label').textContent = `问题 ${cur + 1} / ${QUESTIONS.length}`;
    document.getElementById('prog-fill').style.width = `${((cur + 1) / QUESTIONS.length) * 100}%`;
    document.getElementById('q-num').textContent = q.num;
    document.getElementById('q-text').textContent = q.text;

    const el = document.getElementById('opts');
    el.className = `opts${q.cols > 1 ? ' c' + q.cols : ''}`;
    el.innerHTML = '';
    q.opts.forEach(o => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.textContent = o;
        b.onclick = () => pick(o, b, q.id);
        el.appendChild(b);
    });
}

function pick(val, btn, qid) {
    document.querySelectorAll('#opts .opt').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    const pts = SCORING[qid][val];
    if (pts) Object.entries(pts).forEach(([g, v]) => { if (scores[g] !== undefined) scores[g] += v; });

    setTimeout(() => {
        if (cur < QUESTIONS.length - 1) { cur++; renderQ(); }
        else loading();
    }, 380);
}

function loading() {
    show('s-loading');
    const msgs = ['分析你的星座特质…','匹配你的偶像定位…','解析你的 MBTI 性格…','调配你的专属色彩…','正在召唤你的本命…'];
    let i = 0;
    const el = document.getElementById('load-sub');
    const iv = setInterval(() => { el.textContent = msgs[++i % msgs.length]; }, 550);
    setTimeout(() => { clearInterval(iv); showResult(); }, 2800);
}

function showResult() {
    const sorted = Object.entries(scores).sort(([,a],[,b]) => b - a);
    const [top, topScore] = sorted[0];
    const d = GROUPS[top];

    document.getElementById('r-hero').style.background = d.grad;
    document.getElementById('r-emoji').textContent = d.emoji;
    document.getElementById('r-name').textContent = top;
    document.getElementById('r-traits').textContent = d.traits;
    document.getElementById('r-desc').textContent = d.desc;

    const membersEl = document.getElementById('r-members');
    membersEl.innerHTML = d.members.map(m =>
        `<div class="member-card"><div class="member-name">${m.n}</div><div class="member-pos">${m.p}</div></div>`
    ).join('');

    const bars = document.getElementById('r-bars');
    bars.innerHTML = '';
    sorted.slice(0, 7).forEach(([g, sc]) => {
        const pct = topScore > 0 ? Math.round(sc / topScore * 100) : 0;
        const row = document.createElement('div');
        row.className = 'match-item';
        row.innerHTML = `<div class="match-name">${g}</div>
            <div class="bar-track"><div class="bar-fill" data-w="${pct}%"></div></div>
            <div class="bar-pct">${pct}%</div>`;
        bars.appendChild(row);
    });

    show('s-result');
    setTimeout(() => document.querySelectorAll('.bar-fill').forEach(b => b.style.width = b.dataset.w), 80);
    confetti();
}

function confetti() {
    const cols = ['#FF6B9D','#C77DFF','#FFD700','#00BFFF','#FF6600','#7FFF00'];
    for (let i = 0; i < 70; i++) {
        setTimeout(() => {
            const p = document.createElement('div');
            p.className = 'cf';
            const sz = Math.random() * 9 + 4;
            p.style.cssText = `left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${cols[~~(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${(Math.random()*2+2).toFixed(1)}s;animation-delay:${(Math.random()*.8).toFixed(2)}s`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 4500);
        }, i * 40);
    }
}

function resetQuiz() {
    initScores();
    cur = 0;
    show('s-welcome');
}
